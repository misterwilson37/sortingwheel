<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorting Wheel — Connecting...</title>
<!-- Sorting Wheel redirect page v1.1.0 -->
<style>
  body {
    margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px; font-family: system-ui, sans-serif;
    background: #0b0b18; color: #f0e6d3;
  }
  .spinner { width: 36px; height: 36px; border: 3px solid rgba(201,168,76,0.2); border-top-color: #c9a84c; border-radius: 50%; animation: spin 0.8s linear infinite; }
  .spinner.hidden { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  a { color: #c9a84c; }
</style>
</head>
<body>
  <div class="spinner" id="spinner"></div>
  <div id="msg" style="text-align:center;">Connecting to your Sorting Wheel...</div>

<script>
// ============================================================
//  SORTING WHEEL — Quick Redirect (ellis.html)
// ============================================================
//  This page forwards to the Sorting Wheel app with the correct
//  sheet ID pre-loaded, so staff only have to remember one short
//  URL instead of a long ?sheet=... link.
//
//  Live URL:  sortingwheel.misterwilson.org/ellis.html
//
//  SETUP: Replace DEFAULT_SHEET_ID below with your spreadsheet ID.
//  Find it in the URL when you open your Google Sheet:
//  https://docs.google.com/spreadsheets/d/YOUR_SHEET_ID_HERE/edit
//
//  Usage:
//    /ellis.html                  → uses DEFAULT_SHEET_ID below
//    /ellis.html?sheet=OTHER_ID   → uses the provided ID instead
//
//  NOTE: this script now lives at the END of <body>. It used to sit
//  in <head>, where the error branch called getElementById('msg')
//  before that element existed and threw a TypeError, leaving a
//  bare spinner on screen forever.
// ============================================================

const DEFAULT_SHEET_ID = '1rYZ71el1yPjo1X7F71nI8WQ9LvCqY4g7r-iXr5IYQqE';
const PLACEHOLDER = 'PASTE_YOUR_SHEET_ID_HERE';

const params = new URLSearchParams(window.location.search);
const sheetId = (params.get('sheet') || DEFAULT_SHEET_ID || '').trim();

if (sheetId && sheetId !== PLACEHOLDER) {
  window.location.replace(`./index.html?sheet=${encodeURIComponent(sheetId)}`);
} else {
  document.getElementById('spinner').classList.add('hidden');
  document.getElementById('msg').innerHTML = `
    <p>No sheet ID configured.</p>
    <p style="font-size:14px; opacity:0.6;">
      Edit <code>ellis.html</code> and set <code>DEFAULT_SHEET_ID</code><br>
      to your Google Spreadsheet ID, or go to<br>
      <a href="./index.html">the app</a> to set one up.
    </p>
  `;
}
</script>
</body>
</html>
